[package]
name = "ct-agent-android"
version = "0.1.0"
edition = "2021"
description = "Android bindings for ct-agent/ct-common (CADS-Tunnel Agent-Fabric client), via UniFFI"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "ct_agent_android"

# Real build error, live-caught: `cargo run --bin uniffi-bindgen` (used by
# build.gradle.kts's generateUniffiBindings task) failed with "no bin target named
# uniffi-bindgen" -- the uniffi crate's "cli" feature does NOT auto-provide this binary,
# despite the doc comment on the `uniffi` dependency below implying it does. UniFFI's
# actual documented pattern needs this explicit [[bin]] entry + uniffi-bindgen.rs.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# Same pin ct-agent's own workspace root uses for BOTH native/ and wasm/ (see
# https://github.com/scimbe/ct-agent's Cargo.toml [workspace.dependencies]) --
# verified directly from that repo, not guessed. Bump only in lockstep with
# upstream's own tag bump.
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.13" }
uniffi = { version = "0.28", features = ["cli"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
snow = "0.9"
thiserror = "1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

# Cross-compiled for Android via cargo-ndk; see ../docker/ for the reproducible build environment.
