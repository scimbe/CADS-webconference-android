[package]
name = "native-bridge"
version = "0.1.0"
edition = "2021"
description = "UniFFI spike: prove the Rust -> Android bridge toolchain (UniFFI + cargo-ndk) works end to end before the real Noise_IK/Agent-Fabric bridge is built (#382, devsystem.android_native_bridge)."

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
