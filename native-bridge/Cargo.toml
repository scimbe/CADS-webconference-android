[package]
name = "native-bridge"
version = "0.1.0"
edition = "2021"
description = "Rust -> Android bridge (UniFFI + cargo-ndk) for the real Noise_IK/Agent-Fabric client (#382, devsystem.android_native_bridge). bridge_version proved the toolchain; generate_noise_public_key_hex is the first real call into CADS-Tunnel's own crypto code, not a stub."

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli", "tokio"] }
# Pinned to the exact same tag CADS-devsystem's own Cargo.toml uses, so every
# consumer of ct-common in this ecosystem agrees on the same wire/crypto
# primitives -- not a separately-drifting copy.
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.13" }
# Same "1" range convention ct_common's own Cargo.toml uses for these two --
# see native-bridge/src/message.rs for why this crate follows ct_common's
# serde+serde_json wire-format precedent instead of a binary encoding.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v4 only: this crate needs random UUIDs (see native-bridge/src/message.rs for
# why UUIDv4 over ULID), not the other uuid variants.
uuid = { version = "1", features = ["v4"] }
# native-bridge/src/channel.rs: `ct_common::a2a::{a2a_initiate, a2a_respond, ...}`
# return/consume `snow::TransportState` directly, so a `ChannelSession` field of
# that type needs `snow` as a direct (not just transitive) dependency. Pinned to
# the exact version ct-common's own Cargo.toml (at the v0.4.13 tag above) uses --
# a mismatched semver-compatible-looking version could still resolve to a
# DIFFERENT compiled `snow` crate and fail to unify types at the call boundary.
snow = "0.9"
# Real async I/O for channel.rs's direct peer-to-peer session (TCP dial/listen,
# the Noise_IK handshake, send_text/recv_text) -- unlike bridge_version/
# generate_noise_public_key_hex/the message.rs codec, which are synchronous.
# `rt-multi-thread` + `macros` back `#[uniffi::export(async_runtime = "tokio")]`
# (see channel.rs's module docs for why that attribute, not raw foreign-executor
# polling, is the right call here).
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros"] }
