name: Android CI

# Real continuous verification for the scaffold (#382, devsystem.verify): every push
# and PR against main runs the same two checks done manually so far -- unit tests and
# a debug build -- so verification stops depending on someone running the hermetic
# Docker gate by hand on the production host.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (Robolectric, no emulator)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Requirement #5 (#382 goal doc): "a downloadable, installable release APK
      # artifact that is traceable to the exact source commit it was built from."
      # Debug builds prove the scaffold compiles; this is the real release
      # artifact the requirement actually asks about (criteria 1-4 below).
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Criteria 1/2 together: real, checkable provenance for the exact release
      # artifact this job publishes -- the full commit SHA (not the short one
      # `github.sha` already is), the real versionName/versionCode this build
      # actually used (read back from the built APK's own manifest via aapt,
      # not just echoed from build.gradle.kts source -- so a mismatch between
      # the two would be caught, not silently trusted), and a real SHA-256 of
      # the actual APK bytes so a reviewer can verify the file they download is
      # the one this job built, not a substitute.
      - name: Record build metadata and checksum for the release APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          aapt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          version_name="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          version_code="$("$aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "sha256=$sha256"
            echo "signing_identity=debug-keystore (no dedicated release key provisioned yet -- see app/build.gradle.kts's own signingConfig comment)"
          } | tee app-release-metadata.txt
          # Real, honest field-presence check -- if aapt's own output shape ever
          # changes underneath this parse, fail loudly here rather than publish
          # a metadata file with a silently blank field.
          [ -n "$version_name" ] && [ -n "$version_code" ] && [ -n "$sha256" ]

      # Real, correctly-scoped claim only: this proves the APK's signature is well-formed
      # and would be accepted by Android's package manager -- it does not itself install
      # anything on a device. Issue #15: the step used to be named "...actually installs",
      # which overclaimed what apksigner verify checks. The real install check now lives
      # in the separate `verify-release-install` job below, against a real emulator.
      - name: Verify the release APK's signature is valid (no manual signing step)
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Upload release APK + build metadata
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release-metadata.txt

      # Real installability guard for the artifact this job publishes. The APK's
      # packaged ABI set is not decided by us alone -- AGP packages a lib/<abi>/
      # directory as soon as any dependency contributes a .so to it, and the JNA @aar
      # contributes libjnidispatch.so for five ABIs we ship no native bridge for. A
      # device on one of those ABIs installs the app and then dies with
      # UnsatisfiedLinkError on the first FFI call, which no unit test and no
      # `assembleDebug` exit code can see. This step makes that invariant a build
      # failure: the packaged ABI set must equal the jniLibs ABI set, and every
      # packaged ABI must really carry libnative_bridge.so.
      - name: Verify every packaged ABI carries the native bridge
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          packaged="$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)"
          shipped="$(ls app/src/main/jniLibs | sort -u)"
          echo "packaged in the APK : $(echo $packaged)"
          echo "shipped in jniLibs  : $(echo $shipped)"
          if [ "$packaged" != "$shipped" ]; then
            echo "MISMATCH -- the APK packages an ABI directory we ship no libnative_bridge.so for"
            echo "(or jniLibs holds an ABI that never reaches the APK). A device on such an ABI"
            echo "installs this APK and then fails with UnsatisfiedLinkError on the first FFI call."
            echo "Fix by adjusting defaultConfig.ndk.abiFilters in app/build.gradle.kts and/or jniLibs."
            diff <(echo "$packaged") <(echo "$shipped") || true
            exit 1
          fi
          for abi in $packaged; do
            unzip -Z1 "$apk" "lib/$abi/libnative_bridge.so" | grep -q . \
              || { echo "MISSING: lib/$abi/libnative_bridge.so is not in the APK"; exit 1; }
          done
          echo "OK: packaged ABI set == shipped native-bridge ABI set, each with libnative_bridge.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  # Requirement #5 (#382 goal doc) criterion 3: "The APK is signed with a build key
  # recorded in the run and installs on a clean Android emulator via `adb install`
  # with no manual signing step." Issue #15: the build-and-test job's own apksigner
  # step only ever proved the signature was well-formed, never that the APK actually
  # installs anywhere -- this job closes that gap for real, on a genuinely clean AVD
  # (a fresh GitHub Actions runner, never touched by this workflow's own build steps),
  # not a rebuild of the same claim under a different name.
  verify-release-install:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download the real release APK this run's build-and-test job produced
        uses: actions/download-artifact@v7
        with:
          name: app-release

      # KVM hardware acceleration is required for the emulator to boot in any
      # reasonable time on a GitHub-hosted runner; without this the AVD step below
      # either times out or silently falls back to unusably slow software emulation.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # x86_64, not arm64-v8a: GitHub-hosted runners are x86_64 hardware, so an
      # arm64 AVD image would run under slow software emulation (or fail to boot
      # at all) -- x86_64 is a real ABI this APK ships (app/build.gradle.kts's own
      # abiFilters), so this is a genuine, representative install target, not a
      # workaround that skips the real check.
      - name: Real device install check via a clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            # Two real, live-caught quirks of this action's own `script` input,
            # neither assumed, both confirmed from an actual failing CI run:
            # (1) it runs under dash (/bin/sh), not bash -- `set -o pipefail`
            # is bash-only and dash rejects it outright ("Illegal option -o
            # pipefail"); (2) each line of this block runs as its OWN separate
            # `sh -c` invocation (visible in the run log as one `[command]`
            # per line), so a trailing `\` line continuation is not continuing
            # anything -- it's a literal `\` argument to the next line's own,
            # brand-new shell, which is exactly what made `grep -q ... \`
            # fail with `grep: \: No such file or directory`. Every real
            # command below is therefore self-contained on one physical line.
            set -eu
            adb wait-for-device
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm list packages | grep -q org.bunsenbrenner.webconference || (echo "APK reported a successful install but the package is not listed on the device" && exit 1)
            echo "OK: the real release APK installed on a clean AVD and the package manager confirms it"

  # Requirement #17 (#382 goal doc)'s own last remaining criterion: "An automated Android
  # emulator test enters a non-ASCII peer key ..., asserts the app is still alive and
  # showing the invalid-key error after the Connect tap." native-bridge/src/channel.rs's
  # own unit tests (in build-and-test above) already prove hex_decode_32 itself returns a
  # real error instead of panicking; this job proves the other, previously-unverified half
  # -- that a real UniFFI/JNI call through the actual running app, on real device hardware,
  # surfaces that error to a human instead of crashing the process. Robolectric (JVM-only)
  # cannot exercise the real native call path, only a real device or emulator can.
  verify-connect-flow-instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real instrumented test on a clean Android emulator (requirement #17)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/

  verify-native-bridge:
    runs-on: ubuntu-latest
    # Real supply-chain check (#382): native-bridge/'s .so files and generated Kotlin
    # bindings are committed artifacts, built by hand so far (build-android.sh's own
    # header calls this out: "the .so/.kt files it produces are committed for now --
    # this is still the toolchain spike, not yet CI-integrated"). This job closes
    # that gap: it rebuilds both fresh from source and fails if what's committed
    # doesn't match, so a stale or tampered commit can never slip past silently.
    #
    # Kotlin bindings are compared byte-for-byte (uniffi-bindgen is a deterministic
    # source-to-text generator, no compiler nondeterminism). The .so is compared by
    # its exported FFI symbol set, not a raw byte hash -- rustc/NDK point-release
    # drift can change binary bytes without changing the real, meaningful surface
    # (the symbols Kotlin actually calls), and a raw hash diff would spuriously fail
    # on ordinary toolchain drift instead of catching real staleness/tampering.
    # Verified locally end to end (real cargo-ndk rebuild + uniffi-bindgen regen +
    # diff, against the exact committed artifacts at HEAD) before this job existed.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Install cargo-ndk (pinned, matches native-bridge/build-android.sh)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rebuild native-bridge for Android from source
        working-directory: native-bridge
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t x86_64 -o /tmp/fresh-jniLibs build --release

      - name: Regenerate Kotlin bindings from source
        working-directory: native-bridge
        run: |
          cargo build --lib --release --quiet
          mkdir -p /tmp/fresh-kotlin
          cargo run --quiet --features=uniffi/cli --bin uniffi-bindgen -- \
            generate --library target/release/libnative_bridge.so --language kotlin \
            --out-dir /tmp/fresh-kotlin --no-format

      # Uploaded unconditionally (`if: always()`), BEFORE the diff steps that can fail this
      # job: this is what a fresh, from-source, real NDK r27d build actually produced, on a
      # runner with real resources -- the reference to copy into app/src/main/{jniLibs,java}
      # and commit whenever native-bridge/src/ changes. Exists because this repo's own
      # build-android.sh + a real Docker toolchain image aren't always feasible to run locally
      # (e.g. a memory/disk-constrained dev host) -- CI, not a local machine, is what actually
      # has to be trusted here, so make its output retrievable instead of only pass/fail.
      - name: Upload freshly built native-bridge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-bridge-fresh-build
          path: |
            /tmp/fresh-jniLibs/
            /tmp/fresh-kotlin/

      - name: Verify committed Kotlin bindings match a fresh build exactly
        run: diff -u /tmp/fresh-kotlin/uniffi/native_bridge/native_bridge.kt app/src/main/java/uniffi/native_bridge/native_bridge.kt

      - name: Verify committed .so exported symbols match a fresh build (per ABI)
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            echo "=== $abi ==="
            fresh_syms="$(nm -D --defined-only "/tmp/fresh-jniLibs/$abi/libnative_bridge.so" | awk '{print $3}' | sort)"
            committed_syms="$(nm -D --defined-only "app/src/main/jniLibs/$abi/libnative_bridge.so" | awk '{print $3}' | sort)"
            if [ "$fresh_syms" != "$committed_syms" ]; then
              echo "MISMATCH for $abi -- committed .so's exported symbols differ from a fresh build"
              diff <(echo "$fresh_syms") <(echo "$committed_syms") || true
              exit 1
            fi
            echo "OK: $abi exported symbols match ($(echo "$fresh_syms" | wc -l) symbols)"
          done
